name: deploy_to_dev.yml
on:
  push:
    branches:
      - dev

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_OWNER: ${{ vars.IMAGE_OWNER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  NEW_IMAGE_TAG: "dev-${{ github.sha }}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: ./mvnw clean package

      - name: Prepare artifact
        run: cp target/*.jar service.jar

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/$IMAGE_NAME:$NEW_IMAGE_TAG .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_OWNER/$IMAGE_NAME:$NEW_IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_TOKEN,REGISTRY,IMAGE_OWNER,IMAGE_NAME,NEW_IMAGE_TAG
          script: |
            echo "$GITHUB_TOKEN" | docker login $REGISTRY -u github-actions --password-stdin
            cd ~/cnb_congress
            echo "Deploying version: $NEW_IMAGE_TAG"
            REPORTS_TAG=$NEW_IMAGE_TAG docker compose pull
            REPORTS_TAG=$NEW_IMAGE_TAG docker compose up -d
            docker logout $REGISTRY
            echo "Deploy complete"