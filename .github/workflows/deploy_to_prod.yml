name: deploy_to_prod.yml
on:
  push:
    branches:
      - main

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_OWNER: ${{ vars.IMAGE_OWNER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  NEW_IMAGE_TAG: "prod-${{ github.sha }}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: ./mvnw clean package

      - name: Prepare artifact
        run: cp target/*.jar service.jar

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/$IMAGE_NAME:$NEW_IMAGE_TAG .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_OWNER/$IMAGE_NAME:$NEW_IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/cnb_congress
            
            OLD_TAG=$(docker inspect --format='{{.Config.Image}}' $SERVICE 2>/dev/null | cut -d':' -f2 || true)
            echo "Current running version: $OLD_TAG"
      
            echo "Deploying version: $NEW_IMAGE_TAG"
            REPORTS_TAG=$NEW_IMAGE_TAG docker compose pull
            REPORTS_TAG=$NEW_IMAGE_TAG docker compose up -d

            echo "Waiting for service to start..."
            sleep 60

            if curl --retry 5 --retry-delay 3 -f http://localhost:80/reports/actuator/health; then
              echo "Deploy OK"
            else
              echo "Deploy FAILED"
              if [ -n "$OLD_TAG" ]; then
                echo "Rolling back to $OLD_TAG"
                REPORTS_TAG=$OLD_TAG docker compose pull
                REPORTS_TAG=$OLD_TAG docker compose up -d
                echo "Rollback complete"
              else
                echo "No previous version available, manual intervention required"
                exit 1
              fi
            fi
